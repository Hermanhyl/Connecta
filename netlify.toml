[build]
  command = "npm run build"
  publish = "dist"

# Pin the Node version so the build matches local/CI and satisfies Vite 8
# (needs Node >= 20.19 / 22.12). Without this, Netlify's default image Node
# could drift and break the build.
[build.environment]
  NODE_VERSION = "22"

# Routing is prerendered: `npm run build` emits one real HTML file per route,
# so no SPA rewrites are needed. Unknown paths fall through to the prerendered
# dist/404.html (served automatically with a 404). See public/_redirects.

# Security headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # style-src keeps 'unsafe-inline': framer-motion and Tailwind set inline styles at runtime.
    # This is a low-risk trade-off (style injection only); script-src stays strict ('self', no inline).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self' mailto:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"

# Cache hashed build assets aggressively; they are content-hashed so safe forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
